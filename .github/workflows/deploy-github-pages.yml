name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
      - cursor/flutter-scene-web-demo-9700
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Enable Scene asset pipeline
        run: |
          flutter config --enable-native-assets
          flutter config --enable-dart-data-assets
          flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Build web
        run: |
          flutter build web --release \
            --no-wasm-dry-run \
            --base-href /${{ github.event.repository.name }}/
          # GitHub Pages/Jekyll skips underscore paths without this.
          touch build/web/.nojekyll
          # flutter_scene_generated/.gitignore is "*" so generated files are not
          # committed in source control. If those ignore files are left in the
          # web output, `git add` on gh-pages drops the shader bundles and the
          # app fails with "physical material shaders are missing".
          find build/web -name .gitignore -delete
          if ! find build/web -name '*.shaderbundle' | grep -q .; then
            echo "No shader bundles in build/web; flutter_scene hooks did not ship." >&2
            find build/web/assets -type f | sort
            exit 1
          fi

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: build/web
          publish_branch: gh-pages
          force_orphan: true
          user_name: github-actions[bot]
          user_email: github-actions[bot]@users.noreply.github.com
